anyvisloc:
  root: ${CROSSVIEW_DATA_ROOT}
  config: ${CROSSVIEW_DATA_ROOT}/config_selectable_matchers.yaml
  dataset_root: ${CROSSVIEW_DATA_ROOT}/Data/AnyVisLoc
  save_dir: ${CROSSVIEW_PROJECT_ROOT}/experiments/baseline_anyvisloc

run:
  reference_mode: aerial
  pose_priori: yp
  strategy: Topn_opt
  pnp_method: P3P
  match_keypoints: 3000
  retrieval_k: 5
  success_thresholds: [1, 3, 5, 10, 20]
  device: cuda
  limit: 20
