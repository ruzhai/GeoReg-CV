project:
  name: GeoReg-CV
  task: observer_uav_spatial_registration
  description: Observer-view to UAV/reference-view geo-position estimation.

paths:
  anyvisloc_root: D:/GD/Benchmark
  dataset_root: D:/GD/Benchmark/Data/AnyVisLoc
  weights_root: D:/GD/Benchmark/weights
  output_root: D:/GeoReg-CV/experiments

views:
  observer_view:
    source: anyvisloc_low_altitude_oblique_query
    description: Query image that simulates observer/platform oblique perception.
  reference_view:
    source: anyvisloc_aerial_reference
    description: UAV/orthophoto/aerial reference map for spatial registration.

baseline:
  method: AnyVisLoc
  retrieval_method: CAMP
  matching_method: Roma
  pnp_method: P3P
  reference_mode: aerial
  pose_priori: yp
  strategy: Topn_opt
  retrieval_k: 5
  retrieval_cover: 50
  match_keypoints: 3000
  success_thresholds: [1, 3, 5, 10, 20]
  device: cuda
  batch_size: 128

experiment:
  scene: Scene_01
  limit: 20
  save_name: anyvisloc_baseline_limit20

