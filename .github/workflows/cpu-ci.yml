name: CPU CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / format / types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lint.txt

      - name: Install lint dependencies
        run: python -m pip install -r requirements/lint.txt

      - name: Ruff check
        run: ruff check src tests scripts

      - name: Ruff format
        run: ruff format --check src tests scripts

      - name: Mypy
        run: mypy

  tests:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/cpu.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements/cpu.txt

      - name: Run tests
        run: >-
          python -m pytest tests
          -m "not gpu and not slow"
          --timeout=30
          -W error::ResourceWarning
          --cov=crossview.schema
          --cov=crossview.registry
          --cov-report=term-missing
          --cov-fail-under=90
